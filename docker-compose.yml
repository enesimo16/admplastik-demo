services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: abmadmin
      DB_USER: abmuser
      DB_PASS: localdevpass
    depends_on:
      - db

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: abmadmin
      MYSQL_USER: abmuser
      MYSQL_PASSWORD: localdevpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-import:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports:
      - "8089:80"
    depends_on:
      - db

volumes:
  db_data:
